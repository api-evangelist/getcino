aid: getcino
name: Cino
description: Cino (getcino.com) is a European consumer fintech that offers the first shared virtual card
  that splits and pays a group bill at the same time. Members connect their existing debit or credit cards,
  create a group with configurable split ratios, and each person is charged only their proportional share
  at the moment of payment with no pre-funding required. The shared card works online and in person for
  one-off or recurring expenses, integrates with Apple Pay and Google Pay, supports per-transaction and
  monthly spending limits, and positions itself as a replacement for bill-splitting tools like Splitwise,
  Tricount, PayPal, and Tikkie. Cino is available across 29 European countries and is a portfolio company
  of Balderton Capital. This is a consumer mobile app with no public developer API, SDK, or documentation
  surface at the time of enrichment.
